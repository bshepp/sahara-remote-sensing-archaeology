<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Coordinate - Ruins Finder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        
        .header {
            background: #16213e;
            padding: 1rem 2rem;
            border-bottom: 2px solid #e94560;
        }
        
        .header h1 {
            font-size: 1.5rem;
            font-weight: 500;
            color: #e94560;
        }
        
        .nav {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        
        .nav a {
            color: #aaa;
            text-decoration: none;
        }
        
        .nav a:hover {
            color: #e94560;
        }
        
        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .card {
            background: #16213e;
            padding: 2rem;
            border-radius: 8px;
        }
        
        .card h2 {
            margin-bottom: 1rem;
            font-weight: 500;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #888;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 6px;
            color: #eee;
            font-size: 1rem;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #e94560;
        }
        
        .coord-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .btn {
            padding: 1rem 2rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn:hover {
            background: #d63850;
        }
        
        .alert-error {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Ruins Finder</h1>
        <nav class="nav">
            <a href="/">← Back to Map</a>
        </nav>
    </div>
    
    <div class="container">
        <div class="card">
            <h2>Add New Coordinate</h2>
            
            {% if error %}
            <div class="alert-error">{{ error }}</div>
            {% endif %}
            
            <form method="post">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" placeholder="Site name or description" required>
                </div>
                
                <div class="coord-row">
                    <div class="form-group">
                        <label>Latitude</label>
                        <input type="text" name="latitude" placeholder="e.g. 23.4567" required>
                    </div>
                    <div class="form-group">
                        <label>Longitude</label>
                        <input type="text" name="longitude" placeholder="e.g. 5.1234" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Address (optional)</label>
                    <input type="text" name="address" placeholder="Location description">
                </div>
                
                <div class="form-group">
                    <label>Category</label>
                    <select name="category">
                        <option value="uncategorized">Uncategorized</option>
                        <option value="ruins">Ruins</option>
                        <option value="not_ruins">Not Ruins</option>
                        <option value="uncertain">Uncertain</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Notes (optional)</label>
                    <textarea name="notes" rows="3" placeholder="Any additional information..."></textarea>
                </div>
                
                <button type="submit" class="btn">Add Coordinate</button>
            </form>
        </div>
    </div>
</body>
</html>
